<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Library</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <h1>Book Library</h1>
      <button type="button" id="new-book-btn" class="btn btn-primary">+ New Book</button>
    </header>

    <main>
      <section id="library" class="library" aria-label="Books"></section>
    </main>

    <dialog id="book-dialog" aria-labelledby="book-dialog-title">
      <form id="book-form" class="book-form">
        <h2 id="book-dialog-title">Add a new book</h2>

        <label class="field">
          <span>Title</span>
          <input type="text" name="title" required autocomplete="off" />
        </label>

        <label class="field">
          <span>Author</span>
          <input type="text" name="author" required autocomplete="off" />
        </label>

        <label class="field">
          <span>Pages</span>
          <input type="number" name="pages" min="1" step="1" required />
        </label>

        <label class="field field-checkbox">
          <input type="checkbox" name="read" />
          <span>I have read this book</span>
        </label>

        <div class="form-actions">
          <button type="button" id="cancel-btn" class="btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Add book</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
